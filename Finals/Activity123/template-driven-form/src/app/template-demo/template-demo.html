<!-- template-demo.component.html -->
<div class="card">
  <h2 class="form-title">Template Driven Form</h2>
  <form (ngSubmit)="onSubmit()" #myForm="ngForm">

    <!-- Username -->
    <div class="field-group">
      <label class="field-label">Username</label>
      <input class="input-box" type="text" name="username"
        [(ngModel)]="username" placeholder="Enter username" required>
    </div>

    <!-- Email -->
    <div class="field-group">
      <label class="field-label">Email</label>
      <input class="input-box" type="email" name="email"
        [(ngModel)]="email" placeholder="Enter email" required email>
    </div>

    <!-- Password -->
    <div class="field-group">
      <label class="field-label">Password</label>
      <input class="input-box" type="password" name="password"
        [(ngModel)]="password" placeholder="Enter password" required minlength="6">
    </div>

    <!-- Role -->
    <div class="field-group">
      <label class="field-label">Role</label>
      <select class="input-box" name="role" [(ngModel)]="role" required>
        <option value="" disabled selected>Select role</option>
        <option value="admin">Admin</option>
        <option value="user">User</option>
        <option value="guest">Guest</option>
      </select>
    </div>

    <!-- Gender -->
    <div class="field-group">
      <label class="field-label">Gender</label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="gender" [(ngModel)]="gender" value="male" required> Male
        </label>
        <label class="radio-label">
          <input type="radio" name="gender" [(ngModel)]="gender" value="female" required> Female
        </label>
        <label class="radio-label">
          <input type="radio" name="gender" [(ngModel)]="gender" value="other" required> Other
        </label>
      </div>
    </div>

    <!-- Status -->
    <div class="field-group">
      <label class="field-label">Status</label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="status" [(ngModel)]="status" value="permanent" required> Permanent
        </label>
        <label class="radio-label">
          <input type="radio" name="status" [(ngModel)]="status" value="probationary" required> Probationary
        </label>
      </div>
    </div>

    <!-- Comments -->
    <div class="field-group">
      <label class="field-label">Comments / Notes</label>
      <textarea class="input-box textarea-box" name="comments"
        [(ngModel)]="comments" placeholder="Enter any comments or notes..."></textarea>
    </div>

    <!-- Submit -->
    <input class="btn" type="submit" value="Submit" [disabled]="!myForm.valid">

  </form>

  <!-- Submitted summary (shown after dialog confirmation) -->
  @if (submitted) {
    <div class="submitted-data">
      <h3>Submitted ✔</h3>
      <p><span>Username:</span> {{ username }}</p>
      <p><span>Email:</span> {{ email }}</p>
      <p><span>Role:</span> {{ role }}</p>
      <p><span>Gender:</span> {{ gender }}</p>
      <p><span>Status:</span> {{ status }}</p>
      <p><span>Comments:</span> {{ comments || '—' }}</p>
    </div>
  }
</div>
